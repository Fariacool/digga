services:
  app:
    image: ${IMAGE_NAME:-ghcr.io/fariacool/digga:latest}
    ports:
      - '${HOST_BIND_ADDRESS:-0.0.0.0}:${HOST_PORT:-3000}:3000'
    networks:
      - dualstack
    env_file:
      - .env
    environment:
      NODE_ENV: production
      ENVIRONMENT: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      TZ: ${TZ:-UTC}
    init: true
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/auth', {signal: AbortSignal.timeout(3500)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: '${LOG_MAX_SIZE:-10m}'
        max-file: '${LOG_MAX_FILE:-3}'
    restart: '${RESTART_POLICY:-unless-stopped}'
    stop_grace_period: 15s

networks:
  dualstack:
    driver: bridge
    enable_ipv6: true
